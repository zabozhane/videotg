[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-publisher-bot"
version = "0.1.0"
description = "Async Telegram bot: download IG/YT/Reddit videos and publish to a channel"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.13,<4",
  "aiohttp>=3.9,<4",
  "pydantic-settings>=2.2,<3",
  "yt-dlp>=2024.10.7",
]

[project.scripts]
videobot = "videobot.app_lifecycle.main:main"

[project.optional-dependencies]
dev = [
  "ruff>=0.8.0",
  "mypy>=1.13.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["videobot"]

[[tool.mypy.overrides]]
module = "yt_dlp"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "yt_dlp.cookies"
ignore_missing_imports = true
